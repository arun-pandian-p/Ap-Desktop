name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Test Suites
        run: |
          npm test
          cd backend
          ./mvnw test
          cd ..

      - name: Build Application & Backend JAR
        run: node scripts/build.mjs

      - name: Package Windows Installer
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA-256 Checksums
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path "out" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer .exe found in out/ directory."
            exit 1
          }
          Write-Host "Found installer: $($installer.FullName)"
          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          "$($hash.Hash)  $($installer.Name)" | Out-File -FilePath "out/SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ap-Windows-Installer
          path: |
            out/*.exe
            out/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.exe
            out/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
