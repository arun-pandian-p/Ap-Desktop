# Ap Desktop Spring Boot Backend Configuration
# 1. Strict loopback-only binding
server.address=127.0.0.1
server.port=49280

# 2. Ephemeral internal authentication token (overridden by Electron via CLI or ENV)
ap.security.token=

# 3. SQLite Database path (overridden by Electron, or memory:ap_test_db for fallback)
ap.db.path=

# 4. Logging & Startup Optimization
spring.main.banner-mode=off
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.ap=INFO
logging.level.org.springframework=WARN
