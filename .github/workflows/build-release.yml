name: Build & Package Windows Electron Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Tests
        run: npm run test

      - name: Build & Package Electron Windows Installer
        run: npm run electron:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Installer & Generate Checksum
        shell: powershell
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Fatal: No installer .exe found in release directory."
            exit 1
          }
          Write-Host "Found installer: $($installer.FullName) ($($installer.Length) bytes)"
          if ($installer.Length -lt 10000000) {
            Write-Error "Fatal: Installer file size is suspiciously small ($($installer.Length) bytes)."
            exit 1
          }
          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "release\SHA256SUMS.txt"
          Write-Host "SHA256: $($hash.Hash)"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ap-Windows-Installer
          path: |
            release/*.exe
            release/SHA256SUMS.txt
